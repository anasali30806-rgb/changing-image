<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-container">
        <img src="images/watch1.jpg" alt="watch image" id="image">
        <h1>Classic Watch</h1>
        <p id="para">Timeless elegance, crafted to make every moment count.</p>
        <h3>Price :- 4999</h3>
        <hr>

        <button class="buy" onclick="paragraph()">Buy Now</button>
        <button class="change" onclick="imagechange()">Change Image</button>


        <input type="text" placeholder="Your name" id="username">
        <button class="enter" onclick="welcomeuser( )">Enter</button>
        <hr>


        <button class="change-details" onclick="product()">Change Product Details</button>

    </div>
    <script src="app.js"></script>
</body>
</html>
